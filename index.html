function put(k,v){localStorage.setItem("mfc_"+k,JSON.stringify(v))}
function home(){
document.querySelector("#app").innerHTML=`
<div class="card"><h2>🏋️ Training</h2><p class="muted">Wähle deinen Trainingstag.</p>
<button class="btn" onclick="day('A')">Tag A</button>
<button class="btn" onclick="day('B')">Tag B</button></div>
<div class="card"><h2>📈 Trainingsverlauf</h2><button class="btn secondary" onclick="historyView()">Verlauf anzeigen</button></div>`;
}
function day(d){
const old=get("date"+d).date;
const date=old ? old.split(".").reverse().join("-") : new Date().toISOString().slice(0,10);
document.querySelector("#app").innerHTML=`<button class="btn back" onclick="home()">← Startseite</button>
<div class="card"><h2>Tag ${d}</h2><label>Datum<input class="date" id="date${d}" type="date" value="${date}" onchange="saveDate('${d}')"></label></div>
${exercises[d].map((e,i)=>{
let x=get(e.name+d);
return `<div class="card exercise">
<div class="name">${i+1}. ${e.name}</div>
<img src="${e.img}" alt="${e.name}">
<div class="row">
<label>Gewicht (kg)<input id="w${d}${i}" type="number" step="0.5" value="${x.weight||""}" placeholder="kg"></label>
<label>Wiederholungen<input id="r${d}${i}" type="number" value="${x.reps||""}" placeholder="10–12"></label>
</div>
<button class="btn secondary save" onclick="saveEx('${e.name.replace(/'/g,"\\'")}','${d}',${i})">Speichern</button>
</div>`}).join("")}`;
}
function saveDate(d){
let v=document.querySelector("#date"+d).value;
if(v)localStorage.setItem("mfc_date"+d,JSON.stringify({date:v.split("-").reverse().join(".")}));
}
function saveEx(name,d,i){
put(name+d,{
weight:document.querySelector("#w"+d+i).value,
reps:document.querySelector("#r"+d+i).value,
date:document.querySelector("#date"+d).value.split("-").reverse().join(".")
});
alert("Gespeichert ✓");
}
function historyView(){
let rows=[];
["A","B"].forEach(d=>exercises[d].forEach(e=>{
let x=get(e.name+d);
if(x.weight||x.reps)rows.push(`<p><b>Tag ${d} – ${e.name}</b><br>${x.weight||"—"} kg · ${x.reps||"—"} Wdh. · ${x.date||""}</p>`);
}));
document.querySelector("#app").innerHTML=`<button class="btn back" onclick="home()">← Startseite</button>
<div class="card"><h2>📈 Trainingsverlauf</h2>${rows.length?rows.join(""):"<p class='muted'>Noch keine Einträge.</p>"}</div>`;
}
home();
</script>
</body>
</html>
