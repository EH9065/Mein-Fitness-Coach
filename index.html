<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mein Fitness Coach</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f2f2f7;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 22px 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 26px;
}

header p {
  margin: 6px 0 0;
  opacity: .75;
}

.container {
  padding: 18px;
  max-width: 700px;
  margin: auto;
}

.buttons {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}

button {
  flex: 1;
  padding: 15px;
  border: none;
  border-radius: 12px;
  font-size: 17px;
  font-weight: bold;
  background: #ddd;
}

button.active {
  background: #111;
  color: white;
}

.exercise {
  background: white;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.exercise h2 {
  margin: 0 0 8px;
  font-size: 20px;
}

.exercise p {
  margin: 6px 0;
  line-height: 1.4;
}

.info {
  font-size: 14px;
  color: #666;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin-top: 10px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
}

.save {
  background: #111;
  color: white;
  margin-top: 12px;
}

#message {
  text-align: center;
  margin: 15px 0;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>💪 Mein Fitness Coach</h1>
  <p>Dein persönlicher Trainingsplan</p>
</header>

<div class="container">

  <div class="buttons">
    <button id="tagA" class="active" onclick="showWorkout('A')">
      TAG A
    </button>

    <button id="tagB" onclick="showWorkout('B')">
      TAG B
    </button>
  </div>

  <div id="workout"></div>

</div>

<script>

const workouts = {

A: [
{
name: "Brustpresse",
muscle: "Brust",
sets: "3 × 10–12",
instruction: "Rücken anlehnen, Schulterblätter nach hinten ziehen. Griffe kontrolliert nach vorne drücken und langsam zurückführen."
},
{
name: "Beinpresse",
muscle: "Beine",
sets: "3 × 10–12",
instruction: "Füße etwa schulterbreit aufstellen. Knie kontrolliert beugen und wieder strecken. Nicht komplett durchdrücken."
},
{
name: "Latzug",
muscle: "Rücken",
sets: "3 × 10–12",
instruction: "Stange kontrolliert zur oberen Brust ziehen. Brust aufrecht halten und nicht mit dem Oberkörper schwingen."
},
{
name: "Bizepsmaschine",
muscle: "Bizeps",
sets: "3 × 10–12",
instruction: "Oberarme ruhig halten. Gewicht kontrolliert nach oben ziehen und langsam absenken."
},
{
name: "Bauchmaschine",
muscle: "Bauch",
sets: "3 × 10–12",
instruction: "Bauch anspannen und Oberkörper kontrolliert nach vorne führen. Nicht mit Schwung arbeiten."
}
],

B: [
{
name: "Butterfly",
muscle: "Brust",
sets: "3 × 10–12",
instruction: "Rücken anlehnen und die Griffe kontrolliert zusammenführen. Schulter nicht hochziehen."
},
{
name: "Beinstrecker",
muscle: "Oberschenkel",
sets: "3 × 10–12",
instruction: "Beine kontrolliert strecken und langsam zurückführen. Kein Schwung."
},
{
name: "Rudergerät",
muscle: "Rücken",
sets: "3 × 10–12",
instruction: "Brust aufrecht halten. Ellbogen nach hinten ziehen und Schulterblätter zusammenführen."
},
{
name: "Trizepsmaschine",
muscle: "Trizeps",
sets: "3 × 10–12",
instruction: "Oberarme möglichst ruhig halten und das Gewicht kontrolliert nach unten drücken."
},
{
name: "Bauchmaschine",
muscle: "Bauch",
sets: "3 × 10–12",
instruction: "Bauch anspannen und Bewegung langsam ausführen. Kein Schwung."
}
]

};

function showWorkout(tag) {

  document.getElementById("tagA").classList.remove("active");
  document.getElementById("tagB").classList.remove("active");

  document.getElementById("tag" + tag).classList.add("active");

  let html = "";

  workouts[tag].forEach((exercise, index) => {

    const savedWeight =
      localStorage.getItem(tag + "_" + index) || "";

    html += `
      <div class="exercise">

        <h2>${index + 1}. ${exercise.name}</h2>

        <p><strong>${exercise.muscle}</strong></p>

        <p class="info">
          ${exercise.sets} Wiederholungen
        </p>

        <p>
          ${exercise.instruction}
        </p>

        <input
          type="number"
          step="0.5"
          placeholder="Gewicht in kg"
          value="${savedWeight}"
          id="weight_${tag}_${index}"
        >

        <button
          class="save"
          onclick="saveWeight('${tag}', ${index})">
          Gewicht speichern
        </button>

      </div>
    `;
  });

  document.getElementById("workout").innerHTML = html;
}

function saveWeight(tag, index) {

  const input =
    document.getElementById("weight_" + tag + "_" + index);

  localStorage.setItem(
    tag + "_" + index,
    input.value
  );

  document.getElementById("message").innerText =
    "Gewicht gespeichert 👍";
}

showWorkout("A");

</script>

</body>
</html>
